name: Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
      - name: Run Trivy vulnerability scanner
        # Run trivy directly as a container instead of aquasecurity/trivy-action:
        # the action's setup-trivy chain checks out github.com repos and calls the
        # GitHub REST API with the Forgejo token, which fails ("Bad credentials")
        # on a self-hosted Forgejo runner.
        uses: docker://aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        with:
          args: fs --scanners vuln,secret --exit-code 1 --severity CRITICAL,HIGH --no-progress .
