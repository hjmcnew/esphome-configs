name: Validate

on: push

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - uses: https://code.forgejo.org/actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check components/
      - name: Ruff format
        run: ruff format --check components/

  cppcheck:
    name: C++ Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - uses: https://code.forgejo.org/actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          pip install -r requirements.txt
      - name: Run cppcheck
        run: |
          ESPHOME_INCLUDE=$(python3 -c "import esphome, os; print(os.path.dirname(os.path.dirname(esphome.__file__)))")
          cppcheck \
            -I "$ESPHOME_INCLUDE" \
            --enable=warning,style,performance \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=toomanyconfigs \
            --suppress="*:$ESPHOME_INCLUDE/*" \
            --suppress=useStlAlgorithm \
            --error-exitcode=1 \
            components/

  compile:
    name: Compile Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v6
      - uses: https://code.forgejo.org/actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: https://code.forgejo.org/actions/cache@v5
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('requirements.txt') }}
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Compile test firmware
        run: esphome compile uplift_desk/test_esp32c6.yaml
